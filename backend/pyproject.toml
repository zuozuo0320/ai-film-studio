[project]
name = "ai-film-studio-backend"
version = "0.1.0"
description = "AI 影视创作平台后端：剧本 + 人物 -> 自动出图 -> 图生视频"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pillow>=10.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
